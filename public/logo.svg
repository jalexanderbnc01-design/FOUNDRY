<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background glow/soft reflection -->
    <radialGradient id="outer-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Top facet iridescent glass gradient -->
    <linearGradient id="top-face-prism" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#f472b6" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#fb923c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Deep crystal core reflections (dark prismatic) -->
    <linearGradient id="crystal-dark-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Bottom wing rainbow refraction gradient -->
    <linearGradient id="bottom-face-prism" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#e11d48" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ea580c" stop-opacity="0.9" />
      <stop offset="90%" stop-color="#facc15" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Specular highlight gradients -->
    <linearGradient id="specular-glint" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="rainbow-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="20%" stop-color="#ff9900" />
      <stop offset="40%" stop-color="#ffee00" />
      <stop offset="60%" stop-color="#00ffcc" />
      <stop offset="80%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#cc00ff" />
    </linearGradient>

    <linearGradient id="glass-inner-bevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>

    <filter id="glass-depth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#glass-depth)">
    <!-- TOP SECTION OF S-MONOGRAM -->
    <!-- Top Block Dark Under-volume -->
    <path
      d="M272 40 L468 152 C486 162 488 186 470 200 L380 264 C350 286 312 284 278 266 L220 236 C190 220 152 222 126 242 L72 282 C56 294 36 288 32 268 L24 168 C22 150 36 134 54 124 L244 42 C252 38 264 38 272 40 Z"
      fill="url(#crystal-dark-core)"
    />

    <!-- Top Block Main Iridescent Surface -->
    <path
      d="M268 46 L460 154 C474 162 476 180 462 192 L384 250 C356 270 322 268 290 252 L234 224 C198 206 156 208 126 230 L80 264 C68 272 52 268 50 254 L44 172 C42 158 52 146 66 138 L240 50 C248 46 258 46 268 46 Z"
      fill="url(#top-face-prism)"
      opacity="0.88"
      style="mix-blend-mode: screen;"
    />

    <!-- Top facet isometric ceiling (reflective light plane) -->
    <path
      d="M266 48 L458 154 L276 156 L72 136 L244 50 C252 46 260 46 266 48 Z"
      fill="url(#specular-glint)"
      opacity="0.75"
    />

    <!-- Inner curve of top hook (rainbow refraction) -->
    <path
      d="M136 226 C168 202 210 200 248 218 L304 246 C336 262 366 264 394 242 L454 196 C434 212 404 222 376 218 L296 206 C250 200 206 214 174 244 Z"
      fill="url(#rainbow-edge)"
      opacity="0.8"
    />

    <!-- Specular rim highlight on top facet ridge -->
    <path
      d="M268 46 L460 154"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.95"
    />
    <path
      d="M52 132 L268 46"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.9"
    />
    <path
      d="M276 156 L458 154"
      stroke="url(#rainbow-edge)"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- BOTTOM SECTION OF S-MONOGRAM -->
    <!-- Bottom Block Dark Under-volume -->
    <path
      d="M240 472 L44 360 C26 350 24 326 42 312 L132 248 C162 226 200 228 234 246 L292 276 C322 292 360 290 386 270 L440 230 C456 218 476 224 480 244 L488 344 C490 362 476 378 458 388 L268 470 C260 474 248 474 240 472 Z"
      fill="url(#crystal-dark-core)"
    />

    <!-- Bottom Block Main Iridescent Surface -->
    <path
      d="M244 466 L52 358 C38 350 36 332 50 320 L128 262 C156 242 190 244 222 260 L278 288 C314 306 356 304 386 282 L432 248 C444 240 460 244 462 258 L468 340 C470 354 460 366 446 374 L272 462 C264 466 254 466 244 466 Z"
      fill="url(#bottom-face-prism)"
      opacity="0.9"
      style="mix-blend-mode: screen;"
    />

    <!-- Bottom facet isometric facet -->
    <path
      d="M246 464 L54 358 L236 356 L440 376 L268 462 C260 466 252 466 246 464 Z"
      fill="url(#specular-glint)"
      opacity="0.65"
    />

    <!-- Inner curve of bottom hook (rainbow refraction) -->
    <path
      d="M376 286 C344 310 302 312 264 294 L208 266 C176 250 146 248 118 270 L58 316 C78 300 108 290 136 294 L216 306 C262 312 306 298 338 268 Z"
      fill="url(#rainbow-edge)"
      opacity="0.8"
    />

    <!-- Bottom bevel & rim specular highlights -->
    <path
      d="M244 466 L52 358"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.95"
    />
    <path
      d="M460 380 L244 466"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.9"
    />
    <path
      d="M236 356 L54 358"
      stroke="url(#rainbow-edge)"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Central S-Loop Interlock Glass Refractions & Specular Caustics -->
    <!-- Top inner glass curve highlight -->
    <path
      d="M128 240 Q180 200 240 230 Q300 260 360 250"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linecap="round"
      opacity="0.85"
    />
    <!-- Bottom inner glass curve highlight -->
    <path
      d="M384 272 Q332 312 272 282 Q212 252 152 262"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Prism Glints / Sparkles at acute apex corners -->
    <circle cx="268" cy="46" r="4" fill="#ffffff" />
    <circle cx="460" cy="154" r="3.5" fill="#ffffff" />
    <circle cx="52" cy="132" r="3" fill="#ffffff" />
    <circle cx="244" cy="466" r="4" fill="#ffffff" />
    <circle cx="52" cy="358" r="3.5" fill="#ffffff" />
    <circle cx="460" cy="380" r="3" fill="#ffffff" />
  </g>
</svg>
